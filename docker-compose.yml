services:
  aichator-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aichator-web
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-latest}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-aichator}
      - ANTIGRAVITY_API_URL=${ANTIGRAVITY_API_URL:-}
    volumes:
      - ./knowledge:/app/knowledge
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aichator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./knowledge:/knowledge
    restart: unless-stopped

volumes:
  ollama_data:
